name: Publish to MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io via GitHub OIDC.
# No secrets needed. Trigger: push a version tag (git tag v1.0.0 && git push origin v1.0.0)
# or run manually from the Actions tab.
# PREREQUISITE: the agent-checkout-mcp package must already exist on PyPI at the
# version in server.json — the registry validates the package before accepting.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: Verify listing
        run: |
          curl -sS "https://registry.modelcontextprotocol.io/v0.1/servers?search=oidsdev" | head -c 600
